[workspace]
resolver = "2"
members = [
  "crates/winpassage-core",
  "crates/winpassage-protocol",
  "crates/winpassage-windows",
  "crates/winpassage-server",
  "crates/winpassage-agentctl",
  "apps/admin/src-tauri",
  "apps/client/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/rozsazoltan/winpassage"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
http = "1"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-build = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-service = "0.8"
zeroize = "1"
