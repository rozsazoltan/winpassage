[workspace]
members = [
    "crates/winpassage-core",
    "crates/winpassage-protocol",
    "crates/winpassage-windows",
    "crates/winpassage-server",
    "crates/winpassage-agentctl",
    "crates/winpassage-updater",
    "apps/admin/src-tauri",
    "apps/client/src-tauri",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
http = "1"
secrecy = "0.8"
serde_json = "1"
tauri = "2"
tauri-build = "2"
thiserror = "2"
tracing = "0.1"
url = "2"
windows-service = "0.8"
zeroize = "1"

[workspace.dependencies.chrono]
features = ["serde"]
version = "0.4"

[workspace.dependencies.clap]
features = [
    "derive",
    "env",
]
version = "4"

[workspace.dependencies.serde]
features = ["derive"]
version = "1"

[workspace.dependencies.tokio]
features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
]
version = "1"

[workspace.dependencies.tower-http]
features = [
    "cors",
    "trace",
    "limit",
]
version = "0.6"

[workspace.dependencies.tracing-subscriber]
features = [
    "env-filter",
    "fmt",
]
version = "0.3"

[workspace.dependencies.uuid]
features = [
    "v4",
    "serde",
]
version = "1"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
publish = false
repository = "https://github.com/rozsazoltan/winpassage"
rust-version = "1.85"
version = "0.3.0"
