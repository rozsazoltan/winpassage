name: Rust Quality

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust strict quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-quality-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-quality-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install rust-cache
        uses: verzly/rust-cache@latest
        with:
          install-only: true

      - name: Rust strict quality
        shell: pwsh
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          rust-cache run --config rust-cache.toml -- pwsh -NoLogo -NoProfile -NonInteractive -Command "& { `$ErrorActionPreference = 'Stop'; cargo fmt --all -- --check; cargo check --workspace --all-targets; cargo clippy --workspace --all-targets -- -D warnings; cargo test --workspace --all-targets; cargo test --workspace --doc; cargo doc --workspace --no-deps }"
