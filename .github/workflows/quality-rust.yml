name: Rust Quality

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust strict quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install rust-cache
        uses: verzly/rust-cache@v0
        with:
          install-only: true

      - name: Rust strict quality
        shell: bash
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          rust-cache run --config rust-cache.toml -- bash -lc '
            set -euo pipefail
            cargo fmt --all -- --check
            cargo check --workspace --all-targets
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace --all-targets
            cargo test --workspace --doc
            cargo doc --workspace --no-deps
          '
