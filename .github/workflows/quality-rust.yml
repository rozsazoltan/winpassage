name: Rust Quality

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  rust:
    name: Rust PR quality
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-quality-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-quality-v3-${{ runner.os }}-
            rust-quality-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install rust-cache
        uses: verzly/rust-cache@latest
        with:
          install-only: true

      - name: Rust format, Clippy and tests
        shell: pwsh
        run: |
          rust-cache run --config rust-cache.toml -- pwsh -NoLogo -NoProfile -NonInteractive -Command @'
          $ErrorActionPreference = "Stop"

          function Invoke-CargoStep {
            param([Parameter(Mandatory = $true)][string[]] $CargoArgs)

            & cargo @CargoArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Invoke-CargoStep @("fmt", "--all", "--", "--check")
          Invoke-CargoStep @("clippy", "--workspace", "--all-targets", "--", "-D", "warnings")
          Invoke-CargoStep @("test", "--workspace", "--lib", "--bins")
          '@
