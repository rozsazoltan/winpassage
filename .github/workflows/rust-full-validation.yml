name: Rust Full Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  rust-full:
    name: Rust full validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-full-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-full-v1-${{ runner.os }}-
            rust-quality-v3-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install rust-cache
        uses: verzly/rust-cache@latest
        with:
          install-only: true

      - name: Rust full validation
        shell: pwsh
        run: |
          rust-cache run --config rust-cache.toml -- pwsh -NoLogo -NoProfile -NonInteractive -Command "& {
            `$ErrorActionPreference = 'Stop'
            cargo fmt --all -- --check
            cargo check --workspace --all-targets
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace --all-targets
            cargo test --workspace --doc
            cargo doc --workspace --no-deps
          }"
