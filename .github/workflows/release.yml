name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v, for example 0.2.0"
        required: true
        type: string
      ref:
        description: "Target branch to release from and merge back into"
        required: false
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  RELEASE_ARTIFACT_DIR: dist/release-artifacts
  RELEASE_UPLOAD_DIR: dist/release-upload

jobs:
  prepare-release:
    name: Prepare release branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release_branch: ${{ steps.prepare.outputs.release_branch }}
      target_branch: ${{ steps.prepare.outputs.target_branch }}
      release_sha: ${{ steps.release_head.outputs.release_sha }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Configure Git author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare release branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          github-release prepare \
            --version "${{ inputs.version }}" \
            --target-branch "${{ inputs.ref }}" \
            --config ".github/release/winpassage.github-release.toml"

      - name: Capture release branch commit
        id: release_head
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "Release branch HEAD: ${release_sha}"

  build-service:
    name: Build service binaries
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - binary: winpassage-server
            config: .github/release/winpassage-server.cargo-release.toml
          - binary: winpassage-agentctl
            config: .github/release/winpassage-agentctl.cargo-release.toml
          - binary: winpassage-updater
            config: .github/release/winpassage-updater.cargo-release.toml
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0

      - name: Verify release branch commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ needs.prepare-release.outputs.release_sha }}"
          if [ -z "${expected_sha}" ]; then
            echo "::error::prepare-release did not expose release_sha"
            exit 1
          fi
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::Release branch HEAD mismatch. Expected ${expected_sha}, got ${actual_sha}."
            exit 1
          fi
          echo "Verified release branch HEAD: ${actual_sha}"

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Restore Rust dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-release-service-${{ runner.os }}-${{ matrix.binary }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-release-service-${{ runner.os }}-${{ matrix.binary }}-
            rust-release-service-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install cargo-release
        uses: verzly/cargo-release@latest
        with:
          install-only: true

      - name: Install rust-cache
        uses: verzly/rust-cache@latest
        with:
          install-only: true

      - name: Build ${{ matrix.binary }}
        shell: bash
        run: |
          set -euo pipefail
          cargo-release build --config "${{ matrix.config }}"

      - name: Upload service artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-windows
          path: dist/release/${{ matrix.binary }}/**/*
          if-no-files-found: error
          retention-days: 7

  build-tauri:
    name: Build Tauri apps
    needs: prepare-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: admin
            config: .github/release/winpassage-admin.tauri-release.toml
          - app: client
            config: .github/release/winpassage-client.tauri-release.toml
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_branch }}
          fetch-depth: 0

      - name: Verify release branch commit
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ needs.prepare-release.outputs.release_sha }}"
          if [ -z "${expected_sha}" ]; then
            echo "::error::prepare-release did not expose release_sha"
            exit 1
          fi
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::Release branch HEAD mismatch. Expected ${expected_sha}, got ${actual_sha}."
            exit 1
          fi
          echo "Verified release branch HEAD: ${actual_sha}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/js
            .aube
            node_modules/.aube
          key: aube-release-tauri-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-release-tauri-${{ runner.os }}-${{ matrix.app }}-
            aube-release-tauri-${{ runner.os }}-
            aube-quality-${{ runner.os }}-
            aube-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Restore Rust dependency cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-release-tauri-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-release-tauri-${{ runner.os }}-${{ matrix.app }}-
            rust-release-tauri-${{ runner.os }}-
            rust-release-service-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install tauri-release
        uses: verzly/tauri-release@latest
        with:
          install-only: true

      - name: Build ${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          tauri-release build --config "${{ matrix.config }}"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: winpassage-${{ matrix.app }}-windows
          path: dist/release/winpassage-${{ matrix.app }}/**/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-release, build-service, build-tauri]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.target_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.RELEASE_ARTIFACT_DIR }}

      - name: Stage upload directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RELEASE_UPLOAD_DIR}"
          find "${RELEASE_ARTIFACT_DIR}" -type f -exec cp {} "${RELEASE_UPLOAD_DIR}" \;
          find "${RELEASE_UPLOAD_DIR}" -maxdepth 1 -type f -print | sort

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Configure Git author
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Finalize release
        shell: bash
        run: |
          set -euo pipefail
          github-release finalize \
            --config ".github/release/winpassage.github-release.toml" \
            --target-branch "${{ needs.prepare-release.outputs.target_branch }}" \
            --release-branch "${{ needs.prepare-release.outputs.release_branch }}" \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --assets "${RELEASE_UPLOAD_DIR}"

  cleanup-failed-release-branch:
    name: Delete failed release branch
    needs: [prepare-release, build-service, build-tauri, publish-release]
    if: >-
      always()
      && needs.prepare-release.result == 'success'
      && needs.publish-release.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install github-release
        uses: verzly/github-release@latest
        with:
          install-only: true

      - name: Cleanup release branch
        shell: bash
        run: |
          set -euo pipefail
          github-release abort \
            --config ".github/release/winpassage.github-release.toml" \
            --release-branch "${{ needs.prepare-release.outputs.release_branch }}"
