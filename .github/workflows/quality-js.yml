name: JavaScript Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  js:
    name: JavaScript and Tauri frontends
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.32.1 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: pnpm install --no-frozen-lockfile

      - name: Build frontends
        shell: bash
        run: pnpm check:js
