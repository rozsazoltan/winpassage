name: JavaScript Quality

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24"

jobs:
  js:
    name: JavaScript and Tauri frontends
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore aube cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/js
            .aube
            node_modules/.aube
          key: aube-quality-${{ runner.os }}-${{ hashFiles('aube-workspace.yaml', '**/package.json') }}
          restore-keys: |
            aube-quality-${{ runner.os }}-
            aube-${{ runner.os }}-

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Typecheck frontends
        shell: bash
        run: aube run typecheck:js

      - name: Unit tests
        shell: bash
        run: aube run test:js

      - name: Production builds
        shell: bash
        run: aube run build:js
