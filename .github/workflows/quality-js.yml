name: JavaScript Quality

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js:
    name: JavaScript and Tauri frontends
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Typecheck frontends
        shell: bash
        run: aube run typecheck:js

      - name: Unit tests
        shell: bash
        run: aube run test:js

      - name: Production builds
        shell: bash
        run: aube run build:js
