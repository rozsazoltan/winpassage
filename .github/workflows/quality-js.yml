name: JavaScript Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  js:
    name: JavaScript and Tauri frontends
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up aube
        uses: verzly/setup-aube@v1
        with:
          run_install: true

      - name: Build frontends
        shell: bash
        run: aube run check:js
