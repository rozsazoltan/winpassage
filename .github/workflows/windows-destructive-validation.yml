name: Windows Destructive Validation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_DESTRUCTIVE_WINDOWS_TESTS to create and delete a disposable local Windows user on the runner"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  destructive-windows:
    name: Destructive local account lifecycle validation
    if: ${{ inputs.confirm == 'RUN_DESTRUCTIVE_WINDOWS_TESTS' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore Rust dependency cache
        uses: actions/cache@v5
        with:
          path: |
            .cache/rust
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-destructive-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'rust-cache.toml') }}
          restore-keys: |
            rust-destructive-${{ runner.os }}-
            rust-quality-${{ runner.os }}-
            rust-${{ runner.os }}-

      - name: Install rust-cache
        uses: verzly/rust-cache@latest
        with:
          install-only: true

      - name: Run destructive Windows account lifecycle test
        shell: bash
        env:
          WINPASSAGE_ENABLE_DESTRUCTIVE_WINDOWS_TESTS: "1"
        run: |
          rust-cache run --config rust-cache.toml -- \
            cargo test -p winpassage-windows --test windows_account_lifecycle \
            local_account_lifecycle_works_on_windows -- --ignored --nocapture
