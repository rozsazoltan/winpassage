[project]
root = "."
frontend_install = "aube install"

[build]
out_dir = "dist/release/winpassage-client"
cache_dir = ".cache/tauri-release/winpassage-client"
default_strategy = "host"
container_engine = "podman"

[artifacts]
checksum = true
manifest = true

[platforms.windows]
enabled = true
strategy = "host"
command = "aube run tauri:build --filter winpassage-client"
artifacts = [
  ".cache/rust/packages/winpassage/target/release/bundle/nsis/WinPassageClient_*_x64-setup.exe",
  ".cache/rust/packages/winpassage/target/release/bundle/msi/WinPassageClient_*_x64_en-US.msi",
]

[platforms.linux]
enabled = false
strategy = "host"
command = "aube run tauri:build --filter winpassage-client"
artifacts = []

[platforms.macos]
enabled = false
strategy = "host"
command = "aube run tauri:build --filter winpassage-client"
artifacts = []

[platforms.android]
enabled = false
strategy = "host"
command = "aube run tauri:build --filter winpassage-client"
artifacts = []

[platforms.ios]
enabled = false
strategy = "host"
command = "aube run tauri:build --filter winpassage-client"
artifacts = []
