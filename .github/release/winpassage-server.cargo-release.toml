[project]
root = "."
binary = "winpassage-server"

[build]
out_dir = "dist/release/winpassage-server"
default_strategy = "host"
container_engine = "podman"

[artifacts]
checksum = true
manifest = true
name_template = "winpassage-server-{version}-{target}{ext}"

[targets.windows-x64]
enabled = true
triple = "x86_64-pc-windows-msvc"
strategy = "host"
command = "rust-cache run --config rust-cache.toml -- cargo build --release -p winpassage-server --target x86_64-pc-windows-msvc"
artifacts = [".cache/rust/packages/winpassage/target/x86_64-pc-windows-msvc/release/winpassage-server.exe"]

[targets.linux-x64]
enabled = false

[targets.macos-x64]
enabled = false

[targets.macos-arm64]
enabled = false
